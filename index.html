<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ashrar Ahmed — Software Developer building real-time, cross-platform apps with Flutter and React." />
    <meta name="theme-color" content="#05060a" />
    <title>Ashrar Ahmed — Software Developer (Flutter & React)</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script>
      // Reverses the redirect 404.html performs — decodes the real path back
      // out of the query string before the router mounts, so a direct load
      // or refresh of e.g. /ashrar-portfolio/projects lands on that route
      // instead of the homepage. See public/404.html for the other half.
      (function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded[0] + (decoded.slice(1).length ? '?' + decoded.slice(1).join('&') : '') + l.hash
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
